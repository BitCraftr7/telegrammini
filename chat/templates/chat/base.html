<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>{% block title %}Mini Chat{% endblock %}</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        background: #0e1621;
        color: #fff;
        display: flex;
        height: 100vh;
        overflow: hidden;
    }
    :root {
        --bg-sidebar: #17212b;
        --bg-hover: #202b36;
        --bg-active: #2b5278;
        --text-secondary: #6c7883;
        --bubble-out: #2b5278;
        --bubble-in: #182533;
        --gold-start: #f7d774;
        --gold-end: #e8a33d;
    }

    .sidebar {
        width: 340px;
        min-width: 340px;
        background: var(--bg-sidebar);
        display: flex;
        flex-direction: column;
        border-right: 1px solid #0b131c;
    }
    .sidebar-header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 16px;
        border-bottom: 1px solid #0b131c;
    }
    .logo { width: 34px; height: 34px; }
    .sidebar-header .title { font-size: 18px; font-weight: 600; }
    .sidebar-header .me {
        margin-left: auto;
        text-decoration: none;
    }
    .sidebar-header .me img {
        width: 32px; height: 32px; border-radius: 50%; object-fit: cover;
    }

    .folders { display: flex; border-bottom: 1px solid #0b131c; }
    .folders button {
        flex: 1; background: none; border: none;
        color: var(--text-secondary); padding: 12px 0;
        font-size: 14px; cursor: pointer;
        border-bottom: 2px solid transparent;
    }
    .folders button.active { color: #fff; border-bottom: 2px solid #4ea4f5; }

    .chat-list { flex: 1; overflow-y: auto; }
    .chat-item {
        display: flex; align-items: center; gap: 12px;
        padding: 10px 16px; text-decoration: none; color: #fff; cursor: pointer;
    }
    .chat-item:hover { background: var(--bg-hover); }
    .chat-item.active { background: var(--bg-active); }
    .chat-item img, .chat-item .avatar-fallback {
        width: 48px; height: 48px; border-radius: 50%; object-fit: cover; flex-shrink: 0;
    }
    .avatar-fallback {
        display: flex; align-items: center; justify-content: center;
        background: linear-gradient(135deg, var(--gold-start), var(--gold-end));
        color: #1a1a1a; font-weight: 700;
    }
    .chat-item .info { overflow: hidden; }
    .chat-item .name { font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chat-item .sub { font-size: 13px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .main {
        flex: 1; display: flex; flex-direction: column;
        background: #0e1621;
    }
    .main-header {
        padding: 12px 20px; border-bottom: 1px solid #0b131c;
        display: flex; align-items: center; gap: 12px;
        background: var(--bg-sidebar);
    }
    .main-header img, .main-header .avatar-fallback { width: 40px; height: 40px; }
    .main-header .name { font-size: 16px; font-weight: 600; }

    .chat-log { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; }
    .message-row { display: flex; align-items: flex-end; gap: 8px; margin-bottom: 10px; max-width: 65%; }
    .message-row.out { align-self: flex-end; flex-direction: row-reverse; }
    .message-row img { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; }
    .bubble { background: var(--bubble-in); padding: 8px 12px; border-radius: 14px; font-size: 14.5px; line-height: 1.4; }
    .message-row.out .bubble { background: var(--bubble-out); border-bottom-right-radius: 4px; }
    .message-row:not(.out) .bubble { border-bottom-left-radius: 4px; }
    .bubble .sender { font-size: 12.5px; font-weight: 600; color: #7fbfff; display: block; margin-bottom: 2px;
    .bubble .time { display: block; font-size: 11px; color: #8b98a5; text-align: right; margin-top: 2px; }
    .message-row.out .bubble .time { color: #cfe6ff; }}

    .input-bar { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: var(--bg-sidebar); }
    .input-bar input {
        flex: 1; background: #242f3d; border: none; outline: none;
        color: #fff; padding: 12px 16px; border-radius: 20px; font-size: 14.5px;
    }
    .input-bar input::placeholder { color: var(--text-secondary); }
    .send-btn {
        width: 42px; height: 42px; border-radius: 50%; border: none; cursor: pointer;
        background: linear-gradient(135deg, var(--gold-start), var(--gold-end));
        display: flex; align-items: center; justify-content: center;
    }
    .send-btn svg { width: 20px; height: 20px; }
</style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <svg class="logo" viewBox="0 0 24 24">
                <defs>
                    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#f7d774"/>
                        <stop offset="100%" stop-color="#e8a33d"/>
                    </linearGradient>
                </defs>
                <path fill="url(#g)" d="M2 12.5l19-9-4 19-6-5-3 3-1-6-5-2z"/>
            </svg>
            <div class="title">Mini Chat</div>
            <a href="{% url 'profile' %}" class="me">
                <img src="{{ request.user.profile.avatar.url }}">
            </a>
        </div>

        <div class="folders">
            <button class="folder-btn active" data-filter="all">Hammasi</button>
            <button class="folder-btn" data-filter="private">Shaxsiy</button>
            <button class="folder-btn" data-filter="group">Guruhlar</button>
        </div>

        <div class="chat-list">
            <a href="{% url 'index' %}" class="chat-item {% if active == 'group' %}active{% endif %}" data-type="group">
                <div class="avatar-fallback">G</div>
                <div class="info">
                    <div class="name">Umumiy guruh</div>
                    <div class="sub">Hammaga ochiq</div>
                </div>
            </a>
            {% for u in users %}
            <a href="{% url 'private_chat' u.username %}" class="chat-item {% if active == u.username %}active{% endif %}" data-type="private">
                <img src="{{ u.profile.avatar.url }}">
                <div class="info">
                    <div class="name">{{ u.username }}</div>
                    <div class="sub">{{ u.profile.bio }}</div>
                </div>
            </a>
            {% endfor %}
        </div>
    </div>

    <div class="main">
        {% block main %}{% endblock %}
    </div>

    <script>
        document.querySelectorAll('.folder-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.folder-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                const filter = this.dataset.filter;
                document.querySelectorAll('.chat-item').forEach(item => {
                    item.style.display = (filter === 'all' || item.dataset.type === filter) ? 'flex' : 'none';
                });
            });
        });
    </script>
</body>
</html>
