<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Profil</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        background: radial-gradient(circle at top, #1c2b3a, #0e1621 70%);
        padding: 30px 0;
    }
    .card {
        background: #17212b;
        border-radius: 16px;
        padding: 36px 32px;
        width: 340px;
        box-shadow: 0 12px 40px rgba(0,0,0,0.4);
        text-align: center;
    }
    .avatar-wrap {
        position: relative;
        width: 100px; height: 100px;
        margin: 0 auto 14px;
        cursor: pointer;
    }
    .avatar-preview {
        width: 100px; height: 100px; border-radius: 50%; object-fit: cover;
        border: 3px solid #e8a33d; display: block;
    }
    .avatar-wrap .cam-icon {
        position: absolute; bottom: 0; right: 0;
        width: 30px; height: 30px; border-radius: 50%;
        background: linear-gradient(135deg, #f7d774, #e8a33d);
        display: flex; align-items: center; justify-content: center;
        border: 2px solid #17212b;
    }
    .avatar-wrap .cam-icon svg { width: 15px; height: 15px; fill: #1a1a1a; }
    .avatar-wrap input[type="file"] { display: none; }

    .username { color: #fff; font-size: 19px; font-weight: 600; margin-bottom: 24px; }
    .field { margin-bottom: 16px; text-align: left; }
    .field label { display: block; color: #6c7883; font-size: 13px; margin-bottom: 6px; }
    .field textarea {
        width: 100%; padding: 13px 14px; border-radius: 10px; border: 1px solid #2b3947;
        background: #0e1621; color: #fff; font-size: 14.5px; outline: none; font-family: inherit; resize: vertical;
    }
    .field textarea:focus { border-color: #e8a33d; }
    .btn {
        width: 100%; padding: 13px; border: none; border-radius: 10px;
        background: linear-gradient(135deg, #f7d774, #e8a33d);
        color: #1a1a1a; font-weight: 700; font-size: 15px; cursor: pointer; margin-top: 6px;
    }
    .btn:hover { opacity: 0.9; }
    .btn-logout {
        width: 100%; padding: 13px; border: 1px solid #3a4a5a; border-radius: 10px;
        background: transparent; color: #ff6b6b; font-weight: 600; font-size: 14.5px;
        cursor: pointer; margin-top: 12px; text-decoration: none; display: block; text-align: center;
    }
    .btn-logout:hover { background: rgba(255,107,107,0.08); }
    .bottom-link { text-align: center; margin-top: 14px; font-size: 14px; }
    .bottom-link a { color: #7fbfff; text-decoration: none; }
</style>
</head>
<body>
    <div class="card">
        <form method="post" enctype="multipart/form-data" id="profile-form">
            {% csrf_token %}

            <label class="avatar-wrap" for="id_avatar">
                <img class="avatar-preview" id="avatar-preview-img" src="{{ profile.avatar.url }}">
                <span class="cam-icon">
                    <svg viewBox="0 0 24 24"><path d="M9 3l-1.5 2H4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.5L15 3H9zm3 15a5 5 0 1 1 0-10 5 5 0 0 1 0 10z"/></svg>
                </span>
                {{ form.avatar }}
            </label>

            <div class="username">{{ request.user.username }}</div>

            <div class="field">
                <label>Bio</label>
                {{ form.bio }}
            </div>

            <button type="submit" class="btn">Saqlash</button>
        </form>

        <a href="{% url 'logout' %}" class="btn-logout">Chiqish</a>

        <div class="bottom-link">
            <a href="{% url 'index' %}">← Chatga qaytish</a>
        </div>
    </div>

    <script>
        const avatarInput = document.querySelector('#id_avatar');
        const avatarPreview = document.querySelector('#avatar-preview-img');
        const profileForm = document.querySelector('#profile-form');

        avatarInput.addEventListener('change', function() {
            if (this.files && this.files[0]) {
                avatarPreview.src = URL.createObjectURL(this.files[0]);
                profileForm.submit();
            }
        });
    </script>
</body>
</html>
