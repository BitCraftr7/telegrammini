<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profil</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        background: #F5F8FC;
        padding: 24px 16px;
    }
    .card {
        background: #fff;
        border-radius: 16px;
        padding: 32px 28px;
        width: 100%;
        max-width: 360px;
        box-shadow: 0 4px 24px rgba(20,40,80,0.08);
        text-align: center;
    }
    .top-bar { display: flex; align-items: center; margin-bottom: 20px; }
    .top-bar a { color: #2F80ED; text-decoration: none; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 4px; }
    .top-bar a svg { width: 18px; height: 18px; }

    .avatar-wrap { position: relative; width: 96px; height: 96px; margin: 0 auto 14px; cursor: pointer; }
    .avatar-preview { width: 96px; height: 96px; border-radius: 50%; object-fit: cover; border: 3px solid #EAF3FF; display: block; }
    .avatar-wrap .cam-icon {
        position: absolute; bottom: 0; right: 0;
        width: 30px; height: 30px; border-radius: 50%;
        background: linear-gradient(135deg, #2F80ED, #1C64D1);
        display: flex; align-items: center; justify-content: center;
        border: 3px solid #fff;
    }
    .avatar-wrap .cam-icon svg { width: 14px; height: 14px; fill: #fff; }
    .avatar-wrap input[type="file"] { display: none; }

    .username { color: #1A2333; font-size: 19px; font-weight: 700; margin-bottom: 24px; }
    .field { margin-bottom: 16px; text-align: left; }
    .field label { display: block; color: #8A94A6; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    .field textarea {
        width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid #E4E9F0;
        background: #F5F8FC; color: #1A2333; font-size: 14.5px; outline: none; font-family: inherit; resize: vertical;
    }
    .field textarea:focus { border-color: #2F80ED; background: #fff; }
    .btn {
        width: 100%; padding: 13px; border: none; border-radius: 10px;
        background: linear-gradient(135deg, #2F80ED, #1C64D1);
        color: #fff; font-weight: 700; font-size: 15px; cursor: pointer; margin-top: 6px;
    }
    .btn:hover { opacity: 0.92; }
    .btn-logout {
        width: 100%; padding: 13px; border: 1px solid #FFD6D6; border-radius: 10px;
        background: #FFF5F5; color: #FF5C5C; font-weight: 600; font-size: 14.5px;
        cursor: pointer; margin-top: 12px; text-decoration: none; display: block; text-align: center;
    }
    .btn-logout:hover { background: #FFE9E9; }
</style>
</head>
<body>
    <div class="card">
        <div class="top-bar">
            <a href="{% url 'index' %}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
                Chatga qaytish
            </a>
        </div>

        <form method="post" enctype="multipart/form-data" id="profile-form">
            {% csrf_token %}

            <label class="avatar-wrap" for="id_avatar">
                <img class="avatar-preview" id="avatar-preview-img" src="{{ profile.avatar.url }}">
                <span class="cam-icon">
                    <svg viewBox="0 0 24 24"><path d="M9 3l-1.5 2H4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.5L15 3H9zm3 15a5 5 0 1 1 0-10 5 5 0 0 1 0 10z"/></svg>
                </span>
                {{ form.avatar }}
            </label>

            <div class="username">{{ request.user.username }}</div>

            <div class="field">
                <label>Bio</label>
                {{ form.bio }}
            </div>

            <button type="submit" class="btn">Saqlash</button>
        </form>

        <a href="{% url 'logout' %}" class="btn-logout">Chiqish</a>
    </div>

    <script>
        const avatarInput = document.querySelector('#id_avatar');
        const avatarPreview = document.querySelector('#avatar-preview-img');
        const profileForm = document.querySelector('#profile-form');

        avatarInput.addEventListener('change', function() {
            if (this.files && this.files[0]) {
                avatarPreview.src = URL.createObjectURL(this.files[0]);
                profileForm.submit();
            }
        });
    </script>
</body>
</html>
